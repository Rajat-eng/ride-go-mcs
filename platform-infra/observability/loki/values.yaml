replicaCount: 1

image:
  repository: grafana/loki
  tag: "2.9.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3100
  targetPort: 3100

retention:
  days: 7

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 10Gi
  storageClassName: standard

ingress:
  enabled: false
  className: nginx
  host: loki.local
