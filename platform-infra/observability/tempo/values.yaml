replicaCount: 1

image:
  repository: grafana/tempo
  tag: "2.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    tempo: 3100
    jaeger-grpc: 4317
    jaeger-http: 14268
    zipkin: 9411
    otlp-grpc: 4317
    otlp-http: 4318

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 10Gi
  storageClassName: standard

retention:
  days: 7
