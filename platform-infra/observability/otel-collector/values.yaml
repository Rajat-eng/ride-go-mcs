replicaCount: 1

image:
  repository: otel/opentelemetry-collector-k8s
  tag: "0.88.0"
  pullPolicy: IfNotPresent

mode: daemonset

presets:
  kubeAPIServer:
    enabled: true
  kubeletMetrics:
    enabled: true
  hostMetrics:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    prometheus:
      config:
        scrape_configs:
          - job_name: 'otel-collector'
            scrape_interval: 10s
            static_configs:
              - targets: ['localhost:8888']

  processors:
    memory_limiter:
      check_interval: 5s
      limit_mib: 512
      spike_limit_mib: 128
    batch:
      send_batch_size: 1024
      timeout: 10s
    resource:
      attributes:
        - key: deployment.environment
          value: production
          action: upsert

  exporters:
    otlp:
      endpoint: tempo:4317
      tls:
        insecure: true
    prometheus:
      endpoint: 0.0.0.0:8889
    loki:
      endpoint: http://loki:3100/loki/api/v1/push

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch, resource]
        exporters: [otlp]
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, batch, resource]
        exporters: [prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch, resource]
        exporters: [loki]

service:
  type: ClusterIP
  ports:
    otlp-grpc: 4317
    otlp-http: 4318
    metrics: 8889
    healthcheck: 13133

resources:
  requests:
    cpu: 200m
    memory: 400Mi
  limits:
    cpu: 500m
    memory: 800Mi

livenessProbe:
  httpGet:
    path: /
    port: 13133
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 13133
  initialDelaySeconds: 5
  periodSeconds: 10
