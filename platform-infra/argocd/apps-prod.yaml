apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ride-go/platform-infra
    targetRevision: main
    path: helm/api-gateway
    helm:
      releaseName: api-gateway
      valuesFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
